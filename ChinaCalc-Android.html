<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChinaCalc</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--surface:#ffffff;--surface2:#eef2f7;--text:#172033;
  --muted:#718096;--primary:#1769e0;--primary2:#0d47a1;--line:#e2e8f0;
  --success:#087f5b;--shadow:0 12px 32px rgba(15,23,42,.12)
}
html,body{min-height:100%}
body{
  margin:0;font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
  display:flex;justify-content:center;padding:0
}
.app{
  width:min(430px,100%);min-height:100vh;background:var(--surface);
  box-shadow:var(--shadow);overflow:hidden;transform-origin:top center;position:relative
}
header{
  background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;padding:18px 18px 16px;
  display:flex;justify-content:space-between;align-items:center
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:42px;height:42px;border-radius:13px;background:#ffffff22;display:flex;
  align-items:center;justify-content:center;font-size:23px;box-shadow:inset 0 0 0 1px #ffffff2a
}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.1px}
.sub{font-size:12px;opacity:.82;margin-top:3px}
.headbtn{
  border:0;border-radius:50%;width:42px;height:42px;font-size:25px;line-height:1;
  background:#ffffff1c;color:#fff;cursor:pointer
}
main{padding:18px}
.label{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 7px 3px}
.select{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
  font-size:15px;font-weight:700;margin-bottom:14px;background:#fff;color:var(--text);
  outline:none
}
.display{
  width:100%;font-size:34px;font-weight:800;text-align:right;padding:17px 15px;
  border:1px solid var(--line);border-radius:17px;margin-bottom:14px;background:#f8fafc;
  color:var(--text);outline:none
}
.display:focus{border-color:#7aa7ed;box-shadow:0 0 0 3px #1769e01a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid button{
  height:52px;border:1px solid #e5eaf0;border-radius:15px;background:#f1f4f8;
  color:var(--text);font-size:19px;font-weight:750;box-shadow:0 2px 3px #00000008;
  cursor:pointer;transition:.08s
}
.grid button:active{transform:scale(.96);background:#e2e8f0}
.wide{grid-column:span 2}
.results{margin-top:17px;display:grid;gap:9px}
.result{
  padding:13px 14px;border:1px solid var(--line);border-radius:15px;display:flex;
  justify-content:space-between;align-items:center;background:#fff
}
.result span{font-size:13px;color:var(--muted);font-weight:650}
.result b{font-size:18px}
.result:first-child{border-left:4px solid #e53935}
.result:nth-child(2){border-left:4px solid #2e7d32}
.result:nth-child(3){border-left:4px solid #1565c0}
.rate{
  font-size:11px;line-height:1.45;color:var(--muted);margin:12px 2px
}
.tools{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px
}
.tools label{font-size:12px;font-weight:700;color:var(--muted)}
.tools button{
  height:42px;border:0;border-radius:12px;padding:0 15px;font-weight:750;
  background:#e9eef5;color:var(--text);cursor:pointer
}
.tools input{flex:1;min-width:110px;accent-color:var(--primary)}
.bubble{
  display:none;width:62px;height:62px;border-radius:50%;background:#0d47a1;color:#fff;
  align-items:center;justify-content:center;box-shadow:0 8px 22px #0004;font-size:25px;
  font-weight:800;cursor:pointer;position:fixed;right:18px;bottom:18px
}
.app.minimized{width:62px;min-height:62px;background:transparent;box-shadow:none;overflow:visible}
.app.minimized header,.app.minimized main{display:none}
.app.minimized .bubble{display:flex}
@media(max-width:430px){.app{box-shadow:none}.bubble{right:16px;bottom:16px}}
</style></head>
<body>
<div class="app" id="app">
<header><div class="brand"><div class="logo">¥</div><div><h1>ChinaCalc</h1><div class="sub">Calculadora de monedas</div></div></div><button class="headbtn" id="min" aria-label="Minimizar">−</button></header>
<main id="body">
<div class="label">MONEDA DE ENTRADA</div><select id="from" class="select" aria-label="Moneda de entrada">
<option value="CNY">🇨🇳 Ingresar en Yuanes (CNY)</option><option value="USD">🇺🇸 Ingresar en Dólares (USD)</option><option value="NIO">🇳🇮 Ingresar en Córdobas (NIO)</option>
</select>
<div class="label">CANTIDAD</div><input id="amount" class="display" inputmode="decimal" value="100" aria-label="Cantidad">
<div class="grid">
<button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
<button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
<button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
<button data-v="0" class="wide">0</button><button data-v=".">.</button>
</div>
<div class="results"><div class="result"><span>🇨🇳 Yuan</span><b id="cny"></b></div><div class="result"><span>🇺🇸 Dólares</span><b id="usd"></b></div><div class="result"><span>🇳🇮 Córdobas</span><b id="nio"></b></div></div>
<div class="rate">Tasas de referencia: 1 USD = 6.6977 CNY · 1 USD = 36.6243 NIO</div>
<div class="tools"><label>Tamaño</label><input id="size" type="range" min="80" max="120" value="100"><button id="clear">Borrar</button></div>
</main>
<div class="bubble" id="bubble" title="Abrir ChinaCalc">¥</div>
</div>
<script>
const app=document.getElementById('app'),a=document.getElementById('amount'),from=document.getElementById('from'),cny=document.getElementById('cny'),usd=document.getElementById('usd'),nio=document.getElementById('nio');
const USD_CNY=6.6977,NIO_USD=36.6243;
function calc(){let n=parseFloat(String(a.value).replace(',','.'));if(!Number.isFinite(n)||n<0)n=0;let u,c,r;if(from.value==='CNY'){c=n;u=n/USD_CNY;r=u*NIO_USD}else if(from.value==='USD'){u=n;c=n*USD_CNY;r=n*NIO_USD}else{r=n;u=n/NIO_USD;c=u*USD_CNY}cny.textContent='¥'+c.toFixed(2);usd.textContent='$'+u.toFixed(2);nio.textContent='C$'+r.toFixed(2)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='.'&&a.value.includes('.'))return;if(a.value==='0'&&v!=='.')a.value=v;else a.value+=v;calc()});
a.oninput=calc;from.onchange=calc;document.getElementById('clear').onclick=()=>{a.value='0';calc()};
document.getElementById('size').oninput=e=>{app.style.transform=`scale(${e.target.value/100})`};
function minimize(){app.classList.toggle('minimized')}document.getElementById('min').onclick=minimize;document.getElementById('bubble').onclick=minimize;calc();
</script></body></html>
